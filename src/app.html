<!doctype html>
<html lang="en" class="bg-ground">

    <meta name="theme-color" content="#080d0c" />
    <title>Boomerang</title>
    <link rel="preload" href="%sveltekit.assets%/archivo.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" href="%sveltekit.assets%/icon-16.svg" type="image/svg+xml" />
    <link rel="icon" href="%sveltekit.assets%/icon.svg" type="image/svg+xml" sizes="32x32" />

    <!-- Latin only, weights 400 to 800 and every width, preloaded above. -->

      @font-face { font-family: 'Archivo'; src: url('%sveltekit.assets%/archivo.woff2') format('woff2'); font-weight: 400 800; font-stretch: 62% 125%; font-display: block; }
    </style>
    %sveltekit.head%
  </head>
  <body
    class="m-0 font-sans font-stretch-100% font-[450] text-ink tabular-nums antialiased [-webkit-tap-highlight-color:transparent]"
