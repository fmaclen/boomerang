name: Feature request
description: Something Boomerang can't do yet.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Start from the problem. A clear problem has more than one solution, and
        triage picks the one that fits the rest of the page.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you were trying to do, what got in the way, and how often it happens.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What you do today
      description: The workaround you use now, or why there isn't one.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: An idea for a solution
      description: Optional. Sketches and screenshots of other tools are welcome.
