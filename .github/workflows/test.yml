name: Tests

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Type check and Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: '26'

      # Writes .env with the ports, installs dependencies and the browsers,
      # the same as on a fresh worktree. The runner also needs their system libraries.
      - name: Set up the checkout
        run: |
          python3 scripts/worktree-setup.py
          bunx playwright install-deps chromium webkit

      - name: Type check
        run: bun run check

      # The suite writes screenshots and clips rather than comparing them, and
      # --update-snapshots keeps any future toHaveScreenshot from failing here too.
      - name: Playwright
        run: bun run test --update-snapshots

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results
          path: test-results/
