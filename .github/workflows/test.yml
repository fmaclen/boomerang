name: Tests

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Type check, unit and Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: '26'

      # Writes .env with the ports, installs dependencies and Chromium, the
      # same as on a fresh worktree. The runner also needs its system libraries.
      - name: Set up the checkout
        run: |
          python3 scripts/worktree-setup.py
          bunx playwright install-deps chromium

      - name: Type check
        run: bun run check

      - name: Unit and server tests
        run: bun test --isolate

      # Builds the box and the demo, then runs the browser tests with WebGL off.
      - name: Playwright
        run: bun run test

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results
          path: test-results/
